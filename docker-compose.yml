version: '3.8'

services:
  kernel-builder:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_ID: ${UID:-1000}
        GROUP_ID: ${GID:-1000}
    volumes:
      - .:/workspace
    environment:
      - ARCH=arm
      - CROSS_COMPILE=arm-none-linux-gnueabi-
    command: /bin/bash